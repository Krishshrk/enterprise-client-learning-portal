services:
  azentio-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      AZENTIO_DB_PATH: /data/azentio.db
    volumes:
      - azentio-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  azentio-data:
