<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#173541"/><title>Workspace · Azentio.ai</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="portal.css"/></head>
<body class="workspace-page"><div class="workspace-app" id="workspaceApp"><aside class="app-sidebar"><a class="portal-brand" href="/">azentio<span>.ai</span></a><div class="workspace-switch"><small>ACTIVE WORKSPACE</small><select id="workspaceSelect" aria-label="Active workspace"></select></div><nav id="workspaceNav" aria-label="Workspace navigation"></nav><div class="sidebar-profile"><span class="avatar" id="profileInitials">AZ</span><span id="profileName">Loading…<small id="profileRole"></small></span><button id="logoutButton" aria-label="Sign out" title="Sign out">↪</button></div></aside><main class="app-main"><header class="app-topbar"><div><span id="breadcrumb">Workspace</span><span class="crumb-divider">/</span><strong id="pageTitle">Overview</strong></div><div class="top-actions"><span class="preview-badge">SYNTHETIC DEMO</span><button class="icon-button" id="reloadButton" title="Refresh">↻</button><a class="avatar mini-avatar" href="/" aria-label="Return to public site">AZ</a></div></header><div class="app-content"><div id="workspaceView" aria-live="polite"><div class="loading-box">Loading workspace…</div></div></div></main></div><dialog id="observationModal" class="observation-dialog"><form method="dialog" class="dialog-close-row"><button aria-label="Close">×</button></form><span class="eyebrow">Client workspace</span><h2 id="observationDialogTitle">Share an observation</h2><p class="dialog-intro">Private by default. Do not include personal data, account identifiers, credentials, or confidential transaction details.</p><form id="observationCreateForm" class="observation-fields"><label>Observation title<input name="title" required minlength="4" maxlength="180"/></label><div class="form-grid"><label>Product area<select name="product"><option>Banking</option><option>Capital markets</option><option>Risk &amp; compliance</option><option>Insurance</option><option>Azentio ERP</option></select></label><label>Observation type<select name="kind"><option value="market_observation">Market observation</option><option value="emerging_trend">Emerging trend</option><option value="product_gap">Product gap</option><option value="operational_challenge">Operational challenge</option><option value="successful_practice">Successful practice</option><option value="improvement_suggestion">Improvement suggestion</option></select></label><label>Industry<input name="industry" required value="Financial services"/></label><label>Region<input name="region" required placeholder="e.g. South Asia"/></label><label>Observation period<input name="period" required placeholder="e.g. 2026 Q2"/></label><label>Confidence<select name="confidence"><option>Medium</option><option>Low</option><option>High</option></select></label></div><label>Topic<input name="topic" required placeholder="e.g. Seasonality Context"/></label><label>Description<textarea name="description" rows="4" required minlength="20" maxlength="8000"></textarea></label><label>Supporting evidence (optional)<textarea name="evidence" rows="2" maxlength="4000" placeholder="Do not attach or paste confidential customer records."></textarea></label><label>Suggested business impact<textarea name="impact" rows="2" maxlength="2000"></textarea></label><label>Sharing level<select name="visibility"><option value="private">Private to me</option><option value="organization">Within my organization</option><option value="community">Propose for approved learning community</option></select></label><div class="consent-box"><label><input name="processing_consent" type="checkbox" required/> I consent to Azentio.ai storing and processing this contribution for this workflow.</label><label><input name="share_consent" type="checkbox"/> I explicitly propose sharing a reviewed, de-identified representation with the learning community.</label><label><input name="attribution_consent" type="checkbox"/> I consent to attribution of my organization if a reviewer approves it.</label><label><input name="model_training_consent" type="checkbox"/> I separately opt in to future model-training research, if offered.</label></div><button class="pill pill-mint pill-large" type="submit">Save contribution <span>→</span></button><p class="auth-message" id="observationMessage" aria-live="polite"></p></form></dialog><script src="portal.js"></script></body></html>
